<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCCR Studio — Coming Soon</title>
  <link rel="icon" type="image/png" href="JCCR_PNG.PNG" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- INTRO -->
  <div id="intro">
    <div id="intro-text"></div>
    <div id="intro-logo">
      <img src="JCCR_PNG.PNG" alt="JCCR Studio" />
    </div>
  </div>

  <!-- PÁGINA PRINCIPAL -->
  <div class="page">
    <div class="logo-wrap">
      <img src="JCCR_PNG.PNG" alt="JCCR Studio" />
    </div>

    <div class="contact-section">
      <p class="contact-label">Contacto</p>
      <div class="input-row">
        <input id="email-input" type="email" placeholder="tu@correo.com" autocomplete="email" />
        <button type="button" onclick="handleSubmit()" aria-label="Enviar">→</button>
      </div>
      <p class="form-success" id="form-success">¡Listo! Te contactamos pronto.</p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
