<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCCR Studio — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #fff;
      color: #1a1a18;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }

    /* ── LAYOUT ── */
    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 64px;
      gap: 0;
    }

    /* ── LOGO SVG ── */
    .logo-wrap {
      width: 220px;
      height: 220px;
      margin-bottom: 36px;
    }

    .logo-wrap svg {
      width: 100%;
      height: 100%;
    }

    .logo-wrap text {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 82px;
      fill: #1a1a18;
    }

    .logo-wrap line {
      stroke: #1a1a18;
      stroke-width: 5.5;
      stroke-linecap: round;
    }

    /* ── LOADING BAR ── */
    .bar-wrap {
      width: 220px;
      height: 1.5px;
      background: #e8e5e0;
      position: relative;
      overflow: hidden;
      margin-bottom: 56px;
    }

    .bar-fill {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        #1a1a18 40%,
        #1a1a18 60%,
        transparent 100%
      );
      animation: sweep 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* ── EMAIL SECTION ── */
    .email-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .email-label {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #9b8b78;
    }

    .input-row {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #1a1a18;
      width: 280px;
      max-width: 100%;
    }

    .input-row input[type="email"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: #1a1a18;
      padding: 10px 0;
      text-align: center;
    }

    .input-row input::placeholder {
      color: #c8c4bb;
    }

    .input-row button {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 10px 0 10px 12px;
      color: #6b6b65;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1;
      transition: color 0.2s, transform 0.2s;
    }

    .input-row button:hover {
      color: #1a1a18;
      transform: translateX(2px);
    }

    .form-success {
      display: none;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #9b8b78;
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- LOGO -->
    <div class="logo-wrap">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <text x="8"   y="92">J</text>
        <text x="108" y="92">C</text>
        <line x1="115" y1="133" x2="88" y2="70" />
        <text x="8"   y="186">C</text>
        <text x="108" y="186">R</text>
      </svg>
    </div>

    <!-- BARRA DE CARGA -->
    <div class="bar-wrap">
      <div class="bar-fill"></div>
    </div>

    <!-- EMAIL -->
    <div class="email-section">
      <p class="email-label">Avísame cuando estemos listos</p>
      <div class="input-row">
        <input id="email-input" type="email" placeholder="tu@correo.com" autocomplete="email" />
        <button type="button" onclick="handleSubmit()" aria-label="Enviar">→</button>
      </div>
      <p class="form-success" id="form-success">¡Listo! Te avisamos pronto.</p>
    </div>

  </div>

  <script>
    function handleSubmit() {
      const input   = document.getElementById('email-input');
      const success = document.getElementById('form-success');
      const email   = input.value.trim();
      if (!email || !email.includes('@')) { input.focus(); return; }
      success.style.display = 'block';
      input.value = '';
    }
    document.getElementById('email-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSubmit();
    });
  </script>
</body>
</html>
