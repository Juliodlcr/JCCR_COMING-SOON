<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCCR Studio — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #fff;
      color: #1a1a18;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }

    /* ── LAYOUT ── */
    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 64px;
      gap: 0;
    }

    /* ── LOGO ── */
    .logo-wrap {
      width: 220px;
      height: 220px;
      margin-bottom: 36px;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ── LOADING BAR ── */
    .bar-wrap {
      width: 220px;
      height: 1.5px;
      background: #e8e5e0;
      position: relative;
      overflow: hidden;
      margin-bottom: 56px;
    }

    .bar-fill {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        #1a1a18 40%,
        #1a1a18 60%,
        transparent 100%
      );
      animation: sweep 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* ── EMAIL SECTION ── */
    .email-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .email-label {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #9b8b78;
    }

    .input-row {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #1a1a18;
      width: 280px;
      max-width: 100%;
    }

    .input-row input[type="email"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: #1a1a18;
      padding: 10px 0;
      text-align: center;
    }

    .input-row input::placeholder {
      color: #c8c4bb;
    }

    .input-row button {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 10px 0 10px 12px;
      color: #6b6b65;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1;
      transition: color 0.2s, transform 0.2s;
    }

    .input-row button:hover {
      color: #1a1a18;
      transform: translateX(2px);
    }

    .form-success {
      display: none;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #9b8b78;
    }

    /* ── CORNER MARKS ── */
    .corner-mark {
      position: fixed;
      width: 22px;
      height: 22px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .corner-mark svg {
      width: 100%;
      height: 100%;
    }

    .corner-mark path {
      fill: none;
      stroke: #1a1a18;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- LOGO -->
    <div class="logo-wrap">
      <img src="Logo_JCCR (1).jpg" alt="JCCR Studio" />
    </div>

    <!-- BARRA DE CARGA -->
    <div class="bar-wrap">
      <div class="bar-fill"></div>
    </div>

    <!-- EMAIL -->
    <div class="email-section">
      <p class="email-label">Avísame cuando estemos listos</p>
      <div class="input-row">
        <input id="email-input" type="email" placeholder="tu@correo.com" autocomplete="email" />
        <button type="button" onclick="handleSubmit()" aria-label="Enviar">→</button>
      </div>
      <p class="form-success" id="form-success">¡Listo! Te avisamos pronto.</p>
    </div>

  </div>

  <script>
    /* ── CORNER MARKS ── */
    (function () {
      // L-shape path: corner at (2,2), arms go right and down — rotated per position
      const PATH = 'M 20,2 L 2,2 L 2,20';
      const EDGE_PAD = 18; // px from each edge
      const COUNT    = 14; // total marks in the pool

      // Each entry: [cssLeft, cssTop, rotateDeg]
      // Rotation makes the L open inward:
      //   0°   → top-left style  (arms go right + down)
      //   90°  → top-right style (arms go left  + down)
      //   180° → bottom-right    (arms go left  + up)
      //   270° → bottom-left     (arms go right + up)
      function buildPositions() {
        const p = EDGE_PAD + 'px';
        const positions = [];
        const steps = [15, 30, 45, 55, 70, 85]; // % along each edge

        steps.forEach(pct => {
          const s = pct + '%';
          positions.push(
            // top edge
            { left: s,    top: p,    rot: pct < 50 ? 0   : 90  },
            // bottom edge
            { left: s,    bottom: p, rot: pct < 50 ? 270 : 180 },
            // left edge
            { left: p,    top: s,    rot: pct < 50 ? 0   : 270 },
            // right edge
            { right: p,   top: s,    rot: pct < 50 ? 90  : 180 }
          );
        });

        // Shuffle and pick COUNT
        for (let i = positions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [positions[i], positions[j]] = [positions[j], positions[i]];
        }
        return positions.slice(0, COUNT);
      }

      function createMark(pos) {
        const el = document.createElement('div');
        el.className = 'corner-mark';

        if (pos.left)   el.style.left   = pos.left;
        if (pos.right)  el.style.right  = pos.right;
        if (pos.top)    el.style.top    = pos.top;
        if (pos.bottom) el.style.bottom = pos.bottom;
        el.style.transform = `rotate(${pos.rot}deg)`;

        el.innerHTML = `<svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
          <path d="${PATH}"/>
        </svg>`;

        document.body.appendChild(el);
        return el;
      }

      function scheduleMark(el) {
        const delay   = Math.random() * 5000;          // wait before appearing
        const visible = 800  + Math.random() * 2400;   // how long it stays
        const fade    = 400  + Math.random() * 600;    // fade transition time

        setTimeout(() => {
          el.style.transitionDuration = '0.5s';
          el.style.opacity = '0.55';

          setTimeout(() => {
            el.style.transitionDuration = fade + 'ms';
            el.style.opacity = '0';

            // Schedule next cycle with a random pause after disappearing
            const pause = 1500 + Math.random() * 4000;
            setTimeout(() => scheduleMark(el), pause + fade);
          }, visible);

        }, delay);
      }

      // Init
      const positions = buildPositions();
      positions.forEach(pos => {
        const el = createMark(pos);
        scheduleMark(el);
      });
    })();

    /* ── EMAIL ── */
    function handleSubmit() {
      const input   = document.getElementById('email-input');
      const success = document.getElementById('form-success');
      const email   = input.value.trim();
      if (!email || !email.includes('@')) { input.focus(); return; }
      success.style.display = 'block';
      input.value = '';
    }
    document.getElementById('email-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSubmit();
    });
  </script>
</body>
</html>
