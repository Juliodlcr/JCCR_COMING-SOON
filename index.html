<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JCCR Studio — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #fff;
      color: #1a1a18;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 64px;
    }

    .logo-wrap {
      width: 200px;
      height: 200px;
      margin-bottom: 36px;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .bar-wrap {
      width: 200px;
      height: 1.5px;
      background: #e8e5e0;
      position: relative;
      overflow: hidden;
      margin-bottom: 52px;
    }

    .bar-fill {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, #1a1a18 40%, #1a1a18 60%, transparent 100%);
      animation: sweep 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes sweep {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .email-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .email-label {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #9b8b78;
    }

    .input-row {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #1a1a18;
      width: 280px;
      max-width: 100%;
    }

    .input-row input[type="email"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: #1a1a18;
      padding: 10px 0;
      text-align: center;
    }

    .input-row input::placeholder { color: #c8c4bb; }

    .input-row button {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 10px 0 10px 12px;
      color: #6b6b65;
      font-size: 16px;
      line-height: 1;
      transition: color 0.2s, transform 0.2s;
    }

    .input-row button:hover { color: #1a1a18; transform: translateX(2px); }

    .form-success {
      display: none;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #9b8b78;
    }

    .corner-mark {
      position: fixed;
      width: 22px;
      height: 22px;
      pointer-events: none;
      opacity: 0;
      z-index: 2;
    }
    .corner-mark svg { width: 100%; height: 100%; }
    .corner-mark path {
      fill: none;
      stroke: #1a1a18;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="page">
    <div class="logo-wrap">
      <img src="Logo_JCCR (1).jpg" alt="JCCR Studio" />
    </div>

    <div class="bar-wrap">
      <div class="bar-fill"></div>
    </div>

    <div class="email-section">
      <p class="email-label">Avísame cuando estemos listos</p>
      <div class="input-row">
        <input id="email-input" type="email" placeholder="tu@correo.com" autocomplete="email" />
        <button type="button" onclick="handleSubmit()" aria-label="Enviar">→</button>
      </div>
      <p class="form-success" id="form-success">¡Listo! Te avisamos pronto.</p>
    </div>
  </div>

  <script>
  /* ══════════════════════════════════════════════════
     CANVAS — Puntos y malla en toda la pantalla
     Ciclo de 18s:
       0.00-0.22  puntos aparecen dispersos
       0.18-0.46  migran a la retícula
       0.42-0.66  malla de conexiones emerge
       0.64-0.78  pausa con todo visible
       0.76-1.00  disolución al blanco
     La zona central (logo + barra + correo)
     queda limpia con clip evenodd.
  ══════════════════════════════════════════════════ */
  (function () {
    const canvas = document.getElementById('bg-canvas');
    const ctx    = canvas.getContext('2d');

    const CYCLE = 18;    // segundos por loop
    const UNIT  = 72;    // tamaño de celda base en px

    let W, H, cx, cy;
    let COLS, ROWS, N;
    let gridPos = [], randPos = [], order = [];

    // Zona segura (sin dibujo) — cubre logo + barra + email
    const SAFE_W = 360;
    const SAFE_H = 520;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cx = W / 2;
      cy = H / 2;
      buildGrid();
      initRandom();
    }

    function buildGrid() {
      // Número de columnas/filas que cubren la pantalla
      COLS = Math.ceil(W / UNIT) + 2;
      ROWS = Math.ceil(H / UNIT) + 2;
      N    = COLS * ROWS;

      // Centrado en pantalla
      const ox = cx - Math.floor(COLS / 2) * UNIT;
      const oy = cy - Math.floor(ROWS / 2) * UNIT;

      gridPos = [];
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          gridPos.push({ x: ox + c * UNIT, y: oy + r * UNIT });
    }

    function initRandom() {
      // Posiciones iniciales dispersas por toda la pantalla
      randPos = gridPos.map(() => ({
        x: W * 0.05 + Math.random() * W * 0.90,
        y: H * 0.05 + Math.random() * H * 0.90
      }));

      // Orden aleatorio de aparición de puntos
      order = Array.from({ length: N }, (_, i) => i);
      for (let i = N - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
    }

    resize();
    window.addEventListener('resize', resize);

    const eio = t => t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

    function phP(tc, s, e) {
      if (tc <= s) return 0;
      if (tc >= e) return 1;
      return (tc - s) / (e - s);
    }

    // Aplica clip que EXCLUYE el rectángulo central
    function applyHoleMask() {
      const sx = cx - SAFE_W / 2;
      const sy = cy - SAFE_H / 2;
      ctx.beginPath();
      // Rectángulo exterior (todo el canvas) — sentido horario
      ctx.rect(0, 0, W, H);
      // Rectángulo interior (zona central) — sentido antihorario = agujero
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx, sy + SAFE_H);
      ctx.lineTo(sx + SAFE_W, sy + SAFE_H);
      ctx.lineTo(sx + SAFE_W, sy);
      ctx.closePath();
      ctx.clip('evenodd');
    }

    let startTime = null;

    function frame(ts) {
      requestAnimationFrame(frame);
      if (!startTime) startTime = ts;

      const t  = (ts - startTime) / 1000;
      const tc = (t % CYCLE) / CYCLE;

      ctx.clearRect(0, 0, W, H);

      const pDots    = eio(phP(tc, 0.00, 0.22));
      const pMigrate = eio(phP(tc, 0.18, 0.46));
      const pMesh    = eio(phP(tc, 0.42, 0.66));
      const pFade    = eio(phP(tc, 0.76, 1.00));
      const gA       = 1 - pFade;

      if (gA <= 0.01) return;

      ctx.save();
      applyHoleMask();

      ctx.strokeStyle = '#1a1a18';
      ctx.fillStyle   = '#1a1a18';

      const nDots = Math.round(pDots * N);

      // ── Puntos ──
      for (let i = 0; i < nDots; i++) {
        const idx = order[i];
        const g   = gridPos[idx];
        const r   = randPos[idx];
        const x   = r.x + (g.x - r.x) * pMigrate;
        const y   = r.y + (g.y - r.y) * pMigrate;
        ctx.globalAlpha = gA * 0.40;
        ctx.beginPath();
        ctx.arc(x, y, 1.4, 0, Math.PI * 2);
        ctx.fill();
      }

      // ── Malla ──
      if (pMesh > 0.01) {
        ctx.lineWidth = 0.5;
        // Dibujamos solo los segmentos que ya han "aparecido"
        const totalSegs = (COLS - 1) * ROWS + COLS * (ROWS - 1);
        const nSegs     = Math.round(pMesh * totalSegs);
        let drawn = 0;

        outer:
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const i0 = r * COLS + c;
            // Segmento horizontal
            if (c < COLS - 1) {
              if (drawn++ >= nSegs) break outer;
              const a = gridPos[i0], b = gridPos[i0 + 1];
              ctx.globalAlpha = gA * pMesh * 0.18;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
            // Segmento vertical
            if (r < ROWS - 1) {
              if (drawn++ >= nSegs) break outer;
              const a = gridPos[i0], b = gridPos[i0 + COLS];
              ctx.globalAlpha = gA * pMesh * 0.18;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }
      }

      ctx.restore();
    }

    requestAnimationFrame(frame);
  })();


  /* ══════════════════════════════════════
     CORNER MARKS
  ══════════════════════════════════════ */
  (function () {
    const PATH = 'M 20,2 L 2,2 L 2,20';
    const PAD  = 18, COUNT = 14;

    function buildPositions() {
      const p = PAD + 'px', all = [];
      [15, 30, 45, 55, 70, 85].forEach(pct => {
        const s = pct + '%';
        all.push(
          { left: s,    top: p,    rot: pct < 50 ? 0   : 90  },
          { left: s,    bottom: p, rot: pct < 50 ? 270 : 180 },
          { left: p,    top: s,    rot: pct < 50 ? 0   : 270 },
          { right: p,   top: s,    rot: pct < 50 ? 90  : 180 }
        );
      });
      for (let i = all.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [all[i], all[j]] = [all[j], all[i]];
      }
      return all.slice(0, COUNT);
    }

    function createMark(pos) {
      const el = document.createElement('div');
      el.className = 'corner-mark';
      if (pos.left)   el.style.left   = pos.left;
      if (pos.right)  el.style.right  = pos.right;
      if (pos.top)    el.style.top    = pos.top;
      if (pos.bottom) el.style.bottom = pos.bottom;
      el.style.transform = `rotate(${pos.rot}deg)`;
      el.innerHTML = `<svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
        <path d="${PATH}"/></svg>`;
      document.body.appendChild(el);
      return el;
    }

    function cycle(el) {
      const delay   = Math.random() * 5000;
      const visible = 900  + Math.random() * 2600;
      const fadeOut = 400  + Math.random() * 700;
      setTimeout(() => {
        el.style.transition = 'opacity 0.5s ease';
        el.style.opacity    = '0.5';
        setTimeout(() => {
          el.style.transition = `opacity ${fadeOut}ms ease`;
          el.style.opacity    = '0';
          setTimeout(() => cycle(el), fadeOut + 1200 + Math.random() * 3500);
        }, visible);
      }, delay);
    }

    buildPositions().forEach(pos => cycle(createMark(pos)));
  })();


  /* ══════════════════════════════════════
     EMAIL
  ══════════════════════════════════════ */
  function handleSubmit() {
    const input   = document.getElementById('email-input');
    const success = document.getElementById('form-success');
    const email   = input.value.trim();
    if (!email || !email.includes('@')) { input.focus(); return; }
    success.style.display = 'block';
    input.value = '';
  }
  document.getElementById('email-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSubmit();
  });
  </script>
</body>
</html>
